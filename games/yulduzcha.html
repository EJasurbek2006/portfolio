<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yulduzlarni Yig'! 🭩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            cursor: crosshair;
        }

        /* Orqa fon yulduzlari */
        .bg-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bg-star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* O'yin maydoni */
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            padding: 20px;
        }

        /* Yuqori panel */
        .top-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.7);
            padding: 15px 40px;
            border-radius: 50px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            gap: 40px;
        }

        .stat {
            text-align: center;
            color: #e0e7ff;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #a5b4fc;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        /* Yig'iladigan yulduzcha */
        .star {
            position: absolute;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            filter: drop-shadow(0 0 10px #ffd700);
            animation: float 2s ease-in-out infinite alternate;
            z-index: 10;
        }

        .star:hover {
            transform: scale(1.3);
            filter: drop-shadow(0 0 20px #ffd700);
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(15deg); }
        }

        /* Yig'ish effekti */
        .collect-effect {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            pointer-events: none;
            animation: collect 0.8s ease-out forwards;
            text-shadow: 0 0 10px #ffd700;
        }

        @keyframes collect {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(2); opacity: 0; }
        }

        /* O'yin tugadi ekrani */
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        .game-over.show {
            opacity: 1;
            visibility: visible;
        }

        .game-over h2 {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 30px #ffd700;
        }

        .game-over p {
            font-size: 24px;
            color: #e0e7ff;
            margin-bottom: 30px;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
        }

        Vaqt tugashi haqida ogohlantirish
        .time-warning {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #f87171;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .time-warning.show {
            opacity: 1;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Orqa fon yulduzlari -->
    <div class="bg-stars" id="bgStars"></div>

    <!-- Yuqori panel -->
    <div class="top-bar">
        <div class="stat">
            <div class="stat-label">Ball</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Vaqt</div>
            <div class="stat-value" id="time">30</div>
        </div>
        <div class="stat">
            <div class="stat-label">Yulduzlar</div>
            <div class="stat-value" id="starsCollected">0</div>
        </div>
    </div>

    <!-- Vaqt ogohlantirishi -->
    <div class="time-warning" id="timeWarning">⌛ Vaqt kam qoldi!</div>

    <!-- O'yin maydoni -->
    <div class="game-container" id="gameArea"></div>

    <!-- O'yin tugadi oynasi -->
    <div class="game-over" id="gameOver">
        <h2>🎉 O'yin tugadi!</h2>
        <p>Jami yig'ilgan yulduzlar: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">🔄 Qayta o'ynash</button>
    </div>

    <script>
        // O'yin o'zgaruvchilari
        let score = 0;
        let timeLeft = 30;
        let starsCollected = 0;
        let gameTimer;
        let starSpawner;

        // Elementlar
        const gameArea = document.getElementById('gameArea');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const starsEl = document.getElementById('starsCollected');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const timeWarningEl = document.getElementById('timeWarning');
        const bgStarsEl = document.getElementById('bgStars');

        // Orqa fon yulduzlarini yasash
        function createBgStars() {
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'bg-star';
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                bgStarsEl.appendChild(star);
            }
        }

        // Tasodifiy raqam olish
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Yangi yulduzcha yaratish
        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.innerHTML = '⭐';
            
            // Ekran chegaralari (pastki panelga tushmasin)
            const x = random(30, window.innerWidth - 80);
            const y = random(100, window.innerHeight - 80);
            
            star.style.left = `${x}px`;
            star.style.top = `${y}px`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            
            // Yulduzchani bosganda
            star.addEventListener('click', (e) => collectStar(e, star));
            
            gameArea.appendChild(star);
            
            // 3 soniyadan keyin o'zi yo'qoladi
            setTimeout(() => {
                if (star.parentNode) {
                    star.style.transition = 'all 0.3s ease';
                    star.style.opacity = '0';
                    star.style.transform = 'scale(0)';
                    setTimeout(() => star.remove(), 300);
                }
            }, 2500);
        }

        // Yulduzchani yig'ish
        function collectStar(e, star) {
            score += 10;
            starsCollected++;
            updateStats();
            
            // Yig'ish effekti
            const effect = document.createElement('div');
            effect.className = 'collect-effect';
            effect.textContent = '+10';
            effect.style.left = `${e.clientX - 20}px`;
            effect.style.top = `${e.clientY - 20}px`;
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 800);
            
            star.remove();
        }

        // Statistikani yangilash
        function updateStats() {
            scoreEl.textContent = score;
            starsEl.textContent = starsCollected;
        }

        // Vaqtni hisoblash
        function updateTime() {
            timeLeft--;
            timeEl.textContent = timeLeft;
            
            // Oxirgi 10 soniyada ogohlantirish
            if (timeLeft <= 10 && timeLeft > 0) {
                timeWarningEl.classList.add('show');
            } else {
                timeWarningEl.classList.remove('show');
            }
            
            if (timeLeft <= 0) {
                endGame();
            }
        }

        // O'yinni boshlash
        function startGame() {
            // Avvalgi yulduzlarni tozalash
            document.querySelectorAll('.star').forEach(s => s.remove());
            document.querySelectorAll('.collect-effect').forEach(e => e.remove());
            
            // Boshlang'ich qiymatlar
            score = 0;
            timeLeft = 30;
            starsCollected = 0;
            updateStats();
            timeEl.textContent = timeLeft;
            gameOverEl.classList.remove('show');
            
            // Taymerni boshlash
            gameTimer = setInterval(updateTime, 1000);
            
            // Har 0.8 soniyada yangi yulduzcha chiqadi
            starSpawner = setInterval(createStar, 800);
            createStar(); // Darhol birinchi yulduzni chiqar
        }

        // O'yinni tugatish
        function endGame() {
            clearInterval(gameTimer);
            clearInterval(starSpawner);
            
            finalScoreEl.textContent = starsCollected;
            gameOverEl.classList.add('show');
        }

        // Qayta boshlash
        function restartGame() {
            startGame();
        }

        // Sahifa yuklanganda o'yinni boshlash
        window.onload = () => {
            createBgStars();
            startGame();
        };
    </script>
</body>
</html>
